name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type-check
        run: npm run typecheck
      - name: Tests (chunking, retrieval, MCP round trips; no model download, no API key)
        run: npm test
      - name: Cache the embedding model
        uses: actions/cache@v4
        with:
          path: node_modules/@huggingface/transformers/.cache
          key: embedding-model-all-MiniLM-L6-v2
      - name: Retrieval eval with the real embedding model (fails below 75% hybrid recall@3)
        run: npm run eval --silent -- --min-recall3 0.75
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: retrieval-eval
          path: evals/results/
          retention-days: 30
